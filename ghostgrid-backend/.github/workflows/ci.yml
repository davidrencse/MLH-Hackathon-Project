name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      GHOSTGRID_LIVE_TEST: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tests, build and compiled integrations
        run: pnpm verify
      - name: Check patch whitespace
        run: git diff --check
      - name: Upload compiled application
        if: matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghostgrid-backend-dist
          path: |
            dist/
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  library-bridge:
    name: Python library bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: davidrencse/news
          ref: 553a934874d8d11e1b5eac4c7daef5c4dad0eb6c
          path: .ci/news-library
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements-news-bridge.txt
      - name: Install pinned bridge test dependencies
        run: python -m pip install -r tests/requirements-news-bridge.txt
      - name: Test actual upstream bridge and HTTP read-only behavior
        env:
          GHOSTGRID_NEWS_TEST_SOURCE: ${{ github.workspace }}/.ci/news-library
        run: python -m unittest discover -s tests -p test_news_bridge.py -v
